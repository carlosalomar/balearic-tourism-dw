name: balearic_tourism
version: "1.0.0"
config-version: 2
profile: balearic_tourism

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # dim_date starts here; every source except FRONTUR/EGATUR (2015-10) covers it.
  first_month: "2010-01-01"

models:
  balearic_tourism:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics

seeds:
  balearic_tourism:
    +schema: reference
